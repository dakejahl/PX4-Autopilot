module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_OF_CTRL:
      description:
        short: Optical flow aiding
        long: Enable optical flow fusion.
      type: boolean
      default: 1
    EKF2_OF_DELAY:
      description:
        short: Optical flow measurement delay relative to IMU measurements
        long: |-
          Assumes measurement is timestamped at trailing edge of integration
          period. The default matches a DroneCAN flow node, whose frame reaches
          the flight controller about 7 ms after its integration window closes.
      type: float
      default: 7
      min: 0
      max: 300
      unit: ms
      reboot_required: true
      decimal: 1
    EKF2_OF_GATE:
      description:
        short: Gate size for optical flow fusion
        long: Sets the number of standard deviations used by the innovation consistency
          test.
      type: float
      default: 3.0
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_OF_N_MIN:
      description:
        short: Optical flow minimum noise
        long: Measurement noise for the optical flow sensor when reported quality
          is at EKF2_OF_QMAX or above.
      type: float
      default: 0.15
      min: 0.01
      unit: rad/s
      decimal: 3
    EKF2_OF_N_MAX:
      description:
        short: Optical flow maximum noise
        long: Measurement noise for the optical flow sensor when reported quality
          is at EKF2_OF_QMIN.
      type: float
      default: 0.5
      min: 0.05
      unit: rad/s
      decimal: 2
    EKF2_OF_QMIN:
      description:
        short: In air optical flow minimum quality
        long: Optical Flow data will only be used in air if the sensor reports a
          quality metric >= EKF2_OF_QMIN
      type: int32
      default: 1
      min: 0
      max: 255
    EKF2_OF_ROT_SCL:
      description:
        short: Optical flow rotation scale
        long: The flow sensor's reading of body rotation divided by the gyro's.
          Motion compensation subtracts this times the gyro rate, so a sensor
          that over-reads rotation leaves no false translation. 1 assumes the
          sensor and gyro agree.
      type: float
      default: 1.0
      min: 0.5
      max: 1.5
      decimal: 2
    EKF2_OF_N_RATE:
      description:
        short: Optical flow noise per unit body rate
        long: Observation noise added in quadrature to the quality-based noise,
          in proportion to the body angular rate about X and Y. Rotation the
          compensation misses grows with rate, so this lowers trust in flow
          during manoeuvres. 0 disables.
      type: float
      default: 0.0
      min: 0.0
      max: 2.0
      decimal: 2
    EKF2_OF_N_FLOW:
      description:
        short: Optical flow noise per unit flow rate
        long: Observation noise added in quadrature, as a fraction of the
          motion-compensated flow rate. A sensor that under-reads motion on poor
          texture makes an error proportional to the flow itself, which is large
          near the ground and small at altitude. 0 disables.
      type: float
      default: 0.0
      min: 0.0
      max: 2.0
      decimal: 2
    EKF2_OF_QMAX:
      description:
        short: Optical flow quality at minimum noise
        long: Quality at which observation noise reaches EKF2_OF_N_MIN. Between
          EKF2_OF_QMIN and this value the noise is interpolated linearly from
          EKF2_OF_N_MAX to EKF2_OF_N_MIN. PixArt sensors report raw SQUAL, which
          rarely exceeds 120.
      type: int32
      default: 255
      min: 1
      max: 255
    EKF2_OF_QMIN_GND:
      description:
        short: On ground optical flow minimum quality
        long: Optical Flow data will only be used on the ground if the sensor reports
          a quality metric >= EKF2_OF_QMIN_GND
      type: int32
      default: 0
      min: 0
      max: 255
    EKF2_OF_GYR_SRC:
      description:
        short: Optical flow angular rate compensation source
        long: 'Auto: use gyro from optical flow message if available, internal gyro otherwise.
               Internal: always use internal gyro'
      type: enum
      values:
        0: Auto
        1: Internal
      default: 0
    EKF2_OF_POS_X:
      description:
        short: X position of optical flow focal point in body frame
        long: Forward axis with origin relative to vehicle centre of gravity
      type: float
      default: 0.0
      unit: m
      decimal: 3
    EKF2_OF_POS_Y:
      description:
        short: Y position of optical flow focal point in body frame
        long: Forward axis with origin relative to vehicle centre of gravity
      type: float
      default: 0.0
      unit: m
      decimal: 3
    EKF2_OF_POS_Z:
      description:
        short: Z position of optical flow focal point in body frame
        long: Forward axis with origin relative to vehicle centre of gravity
      type: float
      default: 0.0
      unit: m
      decimal: 3
