module_name: simulator_sih
parameters:
- group: Simulation In Hardware
  definitions:
    SIH_MASS:
      description:
        short: Vehicle mass
        long: This value can be measured by weighting the quad on a scale.
      type: float
      default: 1.0
      unit: kg
      min: 0.0
      decimal: 2
      increment: 0.1
    SIH_IXX:
      description:
        short: Vehicle inertia about X axis
        long: |-
          The inertia is a 3 by 3 symmetric matrix.
          It represents the difficulty of the vehicle to modify its angular rate.
      type: float
      default: 0.025
      unit: kg m^2
      min: 0.0
      decimal: 3
      increment: 0.005
    SIH_IYY:
      description:
        short: Vehicle inertia about Y axis
        long: |-
          The inertia is a 3 by 3 symmetric matrix.
          It represents the difficulty of the vehicle to modify its angular rate.
      type: float
      default: 0.025
      unit: kg m^2
      min: 0.0
      decimal: 3
      increment: 0.005
    SIH_IZZ:
      description:
        short: Vehicle inertia about Z axis
        long: |-
          The inertia is a 3 by 3 symmetric matrix.
          It represents the difficulty of the vehicle to modify its angular rate.
      type: float
      default: 0.03
      unit: kg m^2
      min: 0.0
      decimal: 3
      increment: 0.005
    SIH_IXY:
      description:
        short: Vehicle cross term inertia xy
        long: |-
          The inertia is a 3 by 3 symmetric matrix.
          This value can be set to 0 for a quad symmetric about its center of mass.
      type: float
      default: 0.0
      unit: kg m^2
      decimal: 3
      increment: 0.005
    SIH_IXZ:
      description:
        short: Vehicle cross term inertia xz
        long: |-
          The inertia is a 3 by 3 symmetric matrix.
          This value can be set to 0 for a quad symmetric about its center of mass.
      type: float
      default: 0.0
      unit: kg m^2
      decimal: 3
      increment: 0.005
    SIH_IYZ:
      description:
        short: Vehicle cross term inertia yz
        long: |-
          The inertia is a 3 by 3 symmetric matrix.
          This value can be set to 0 for a quad symmetric about its center of mass.
      type: float
      default: 0.0
      unit: kg m^2
      decimal: 3
      increment: 0.005
    SIH_T_MAX:
      description:
        short: Max multicopter propeller thrust force
        long: |-
          This is the maximum force delivered by one propeller
          when the motor is running at full speed.

          This value is usually about 5 times the mass of the quadrotor.

          Refer to SIH_F_T_MAX for the thrust for FW, Tailsitter, and VTOL pusher.
      type: float
      default: 5.0
      unit: N
      min: 0.0
      decimal: 2
      increment: 0.5
    SIH_Q_MAX:
      description:
        short: Max multicopter propeller torque
        long: |-
          This is the maximum torque delivered by one propeller
          when the motor is running at full speed.

          This value is usually about few percent of the maximum thrust force.

          Refer to SIH_F_Q_MAX for the propeller torque for FW, Tailsitter, and VTOL pusher.
      type: float
      default: 0.1
      unit: Nm
      min: 0.0
      decimal: 3
      increment: 0.05
    SIH_L_ROLL:
      description:
        short: Roll arm length
        long: |-
          This is the arm length generating the rolling moment

          This value can be measured with a ruler.
          This corresponds to half the distance between the left and right motors.
      type: float
      default: 0.2
      unit: m
      min: 0.0
      decimal: 2
      increment: 0.05
    SIH_L_PITCH:
      description:
        short: Pitch arm length
        long: |-
          This is the arm length generating the pitching moment

          This value can be measured with a ruler.
          This corresponds to half the distance between the front and rear motors.
      type: float
      default: 0.2
      unit: m
      min: 0.0
      decimal: 2
      increment: 0.05
    SIH_KDV:
      description:
        short: First order drag coefficient
        long: |-
          Physical coefficient representing the friction with air particles.
          The greater this value, the slower the quad will move.

          Drag force function of velocity: D=-KDV*V.
          The maximum freefall velocity can be computed as V=10*MASS/KDV [m/s]
      type: float
      default: 1.0
      unit: N/(m/s)
      min: 0.0
      decimal: 2
      increment: 0.05
    SIH_KDW:
      description:
        short: First order angular damper coefficient
        long: |-
          Physical coefficient representing the friction with air particles during rotations.
          The greater this value, the slower the quad will rotate.

          Aerodynamic moment function of body rate: Ma=-KDW*W_B.
          This value can be set to 0 if unknown.
      type: float
      default: 0.025
      unit: Nm/(rad/s)
      min: 0.0
      decimal: 3
      increment: 0.005
    SIH_LOC_LAT0:
      description:
        short: Initial geodetic latitude
        long: |-
          This value represents the North-South location on Earth where the simulation begins.

          LAT0, LON0, H0, MU_X, MU_Y, and MU_Z should ideally be consistent among each others
          to represent a physical ground location on Earth.
      type: float
      default: 47.397742
      unit: deg
      min: -90
      max: 90
    SIH_LOC_LON0:
      description:
        short: Initial geodetic longitude
        long: |-
          This value represents the East-West location on Earth where the simulation begins.

          LAT0, LON0, H0, MU_X, MU_Y, and MU_Z should ideally be consistent among each others
          to represent a physical ground location on Earth.
      type: float
      default: 8.545594
      unit: deg
      min: -180
      max: 180
    SIH_LOC_H0:
      description:
        short: Initial AMSL ground altitude
        long: |-
          This value represents the Above Mean Sea Level (AMSL) altitude where the simulation begins.

          If using FlightGear as a visual animation,
          this value can be tweaked such that the vehicle lies on the ground at takeoff.

          LAT0, LON0, H0, MU_X, MU_Y, and MU_Z should ideally be consistent among each others
          to represent a physical ground location on Earth.
      type: float
      default: 489.4
      unit: m
      min: -420.0
      max: 8848.0
      decimal: 2
      increment: 0.01
    SIH_LOC_YAW0:
      description:
        short: Initial heading (yaw) of the simulated vehicle
        long: |-
          This value represents the initial heading (yaw) of the simulated vehicle at the start of the simulation.
      type: float
      default: 0.0
      unit: rad
      min: -3.14159
      max: 3.14159
      decimal: 3
      increment: 0.01
    SIH_DISTSNSR_MIN:
      description:
        short: distance sensor minimum range
      type: float
      default: 0.0
      unit: m
      min: 0.0
      max: 10.0
      decimal: 4
      increment: 0.01
    SIH_DISTSNSR_MAX:
      description:
        short: distance sensor maximum range
      type: float
      default: 100.0
      unit: m
      min: 0.0
      max: 1000.0
      decimal: 4
      increment: 0.01
    SIH_DISTSNSR_OVR:
      description:
        short: if >= 0 the distance sensor measures will be overridden by this value
        long: Absolute value superior to 10000 will disable distance sensor
      type: float
      default: -1.0
      unit: m
    SIH_WLD_TYPE:
      description:
        short: Obstacle world
        long: |-
          Obstacles around home that the simulated range image sensor sees. The
          vehicle does not collide with them. Trees are vertical trunks scattered
          from SIH_WLD_SEED, one per square cell of SIH_WLD_SPACING at most, with
          none within SIH_WLD_CLEAR of home. Course is a fixed line north of home:
          a 1.5 m fence 8 m out, then a roof 4 m up from 14 m to 30 m out.
      type: enum
      values:
        0: None
        1: Trees
        2: Course
      default: 0
    SIH_WLD_SEED:
      description:
        short: Obstacle world seed
        long: The same seed gives the same obstacles on every boot.
      type: int32
      default: 0
    SIH_WLD_SPACING:
      description:
        short: Obstacle world cell size
        long: Side of the square cell that holds at most one tree.
      type: float
      default: 5.0
      unit: m
      min: 1.5
      max: 100.0
      decimal: 1
      increment: 0.5
    SIH_WLD_DENSITY:
      description:
        short: Obstacle world density
        long: Probability that a cell holds a tree.
      type: float
      default: 0.5
      min: 0.0
      max: 1.0
      decimal: 2
      increment: 0.05
    SIH_WLD_CLEAR:
      description:
        short: Obstacle world clear radius
        long: No obstacle surface lies within this distance of home.
      type: float
      default: 4.0
      unit: m
      min: 0.0
      max: 1000.0
      decimal: 1
      increment: 0.5
    SIH_RIMG_EN:
      description:
        short: Simulated range image sensor
        long: |-
          Publishes range_image and range_image_info from a forward-facing
          multizone time-of-flight sensor that sees the ground and the
          SIH_WLD_TYPE obstacles. The defaults model an ST VL53L9CX binned 2x2.
      type: boolean
      default: 0
    SIH_RIMG_ROWS:
      description:
        short: Range image rows
      type: int32
      default: 21
      min: 1
      max: 128
    SIH_RIMG_COLS:
      description:
        short: Range image columns
      type: int32
      default: 27
      min: 1
      max: 256
    SIH_RIMG_HFOV:
      description:
        short: Range image horizontal field of view
      type: float
      default: 55.0
      unit: deg
      min: 1.0
      max: 360.0
      decimal: 1
    SIH_RIMG_VFOV:
      description:
        short: Range image vertical field of view
      type: float
      default: 42.0
      unit: deg
      min: 1.0
      max: 180.0
      decimal: 1
    SIH_RIMG_MAX:
      description:
        short: Range image maximum range
        long: Zones with nothing closer read no return.
      type: float
      default: 8.0
      unit: m
      min: 0.5
      max: 100.0
      decimal: 1
    SIH_RIMG_RATE:
      description:
        short: Range image frame rate
      type: float
      default: 10.0
      unit: Hz
      min: 1.0
      max: 100.0
      decimal: 1
    SIH_T_TAU:
      description:
        short: thruster time constant tau
        long: the time taken for the thruster to step from 0 to 100% should be about
          4 times tau
      type: float
      default: 0.05
      unit: s
    SIH_VEHICLE_TYPE:
      description:
        short: Vehicle type
      type: enum
      values:
        0: Quadcopter
        1: Fixed-Wing
        2: Tailsitter
        3: Standard VTOL
        4: Hexacopter
        5: Rover Ackermann
      default: 0
      reboot_required: true
    SIH_WIND_N:
      description:
        short: Wind velocity from north direction
      type: float
      default: 0.0
      unit: m/s
    SIH_WIND_E:
      description:
        short: Wind velocity from east direction
      type: float
      default: 0.0
      unit: m/s
    SIH_RNGBC_NOISE:
      description:
        short: Ranging beacon measurement noise standard deviation
        long: Gaussian noise added to simulated ranging beacon measurements. Set to 0 to disable noise.
      type: float
      default: 30.0
      unit: m
      min: 0.0
      max: 100.0
      decimal: 1
    SIH_F_T_MAX:
      description:
        short: Forward thruster max thrust (N)
        long: |-
          This is used for the Fixed-Wing, Tailsitter, or pusher of the Standard VTOL
          if SIH_F_CT0 <= 0.
          If SIH_F_CT0 > 0, propeller model with advance ratio J is used
          and this parameter value is overridden at simulation startup.
      type: float
      default: 2.0
      unit: N
      min: 0.0
      decimal: 3
    SIH_F_Q_MAX:
      description:
        short: Forward thruster max torque (Nm)
        long: |-
          This is used for the Fixed-Wing, Tailsitter, or pusher of the Standard VTOL
          if SIH_F_CP0 <= 0.
          If SIH_F_CP0 > 0, propeller model with advance ratio J is used
          and this parameter value is overridden at simulation startup.
      type: float
      default: 0.0165
      unit: Nm
      min: 0.0
      decimal: 3
    SIH_F_CT0:
      description:
        short: Forward thruster static thrust coefficient
      type: float
      default: 0.0
      min: 0.0
      decimal: 3
    SIH_F_CT1:
      description:
        short: Forward thruster thrust coefficient 1
        long: CT(J) = CT0 + CT1*J + CT2*J^2
      type: float
      default: 0.0
      decimal: 3
    SIH_F_CT2:
      description:
        short: Forward thruster thrust coefficient 2
        long: CT(J) = CT0 + CT1*J + CT2*J^2
      type: float
      default: 0.0
      max: 0.0
      decimal: 3
    SIH_F_CP0:
      description:
        short: Forward thruster static power coefficient
      type: float
      default: 0.0
      min: 0.0
      decimal: 3
    SIH_F_CP1:
      description:
        short: Forward thruster power coefficient 1
        long: CP(J) = CP0 + CP1*J + CP2*J^2
      type: float
      default: 0.0
      decimal: 3
    SIH_F_CP2:
      description:
        short: Forward thruster power coefficient 2
        long: CP(J) = CP0 + CP1*J + CP2*J^2
      type: float
      default: 0.0
      max: 0.0
      decimal: 3
    SIH_F_DIA_INCH:
      description:
        short: Forward thruster propeller diameter in inches
      type: float
      default: 0.1
      min: 0.1
      decimal: 1
    SIH_F_RPM_MAX:
      description:
        short: Forward thruster max RPM
      type: float
      default: 6000.0
      min: 0.1
      decimal: 1
