module_name: RC Input Driver
parameters:
    - group: RC Input
      definitions:
        RC_INPUT_PROTO:
            description:
                short: RC input protocol
                long: |
                    Select your RC input protocol or auto to scan.
            category: System
            type: enum
            values:
                -1: Auto
                0: None
                1: PPM
                2: SBUS
                3: DSM
                4: ST24
                5: SUMD
                6: CRSF
                7: GHST
            min: -1
            max: 7
            default: -1

        RC_PPM_PIN:
            description:
                short: PPM input pin
                long: |
                    Selects which pin carries PPM on boards that route more than one.
                    Index into the board's PPM pin list, 0 is the board default.
                    No effect on boards with a single PPM pin.
            category: System
            type: int32
            min: 0
            max: 3
            default: 0
            reboot_required: true

serial_config:
    - command: set RC_INPUT_ARGS "-d ${SERIAL_DEV}"
      port_config_param:
        name: RC_PORT_CONFIG
        group: Serial
        default: RC
        description_extended: |
            Setting this to 'Disabled' will use a board-specific default port
            for RC input.
